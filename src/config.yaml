timeframes:
  - 15m
  - 30m
  - 1h
  - 4h
  - 1d
data_dir: "data"
cache_dir: "cache/processed"
max_batch_size: 2000
color_scale:
  - [0.0, "#FF0000"]
  - [0.3, "#FF6B6B"]
  - [0.5, "#2D3038"]
  - [0.7, "#4ECDC4"]
  - [1.0, "#00C896"]
bar_colors:
  positive: "#00C896"
  negative: "#FF6B6B"
background_color: "#0E1117"
plot_background_color: "#1E2128"
grid_color: "#2D3038"
text_color: "#FFFFFF"